[project]
name = "emotion-calibration"
version = "0.1.0"
description = "Small educational project on post-calibration of emotion classifier probabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ravdess-convert = "emotion_calibration.convert_ravdess:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emotion_calibration"]
